<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Language Translator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white shadow-xl rounded-2xl w-full max-w-4xl p-6 md:p-8 border border-slate-200">
    
    <!-- Header -->
    <div class="mb-6 text-center">
      <h1 class="text-3xl font-bold text-slate-800 flex items-center justify-center gap-2">
        <i class="fa-solid font-sharp fa-language text-indigo-600"></i> Language Translator
      </h1>
      <p class="text-slate-500 text-sm mt-1">Translate text seamlessly across multiple languages</p>
    </div>

    <!-- Translation Container -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- Input Box -->
      <div class="flex flex-col border border-slate-300 rounded-xl p-4 focus-within:ring-2 focus-within:ring-indigo-500 bg-slate-50">
        <div class="flex justify-between items-center pb-2 mb-2 border-b border-slate-200">
          <select id="fromLang" class="bg-transparent text-slate-700 font-semibold focus:outline-none cursor-pointer">
            <!-- Populated via JS -->
          </select>
          <button id="clearBtn" title="Clear Text" class="text-slate-400 hover:text-red-500 transition">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <textarea id="inputText" rows="6" placeholder="Type text here..." 
          class="w-full bg-transparent resize-none focus:outline-none text-slate-800 placeholder-slate-400"></textarea>
        <div class="flex justify-between items-center pt-2 text-slate-400 text-sm">
          <button id="inputSpeakBtn" title="Listen" class="hover:text-indigo-600 transition">
            <i class="fa-solid fa-volume-high"></i>
          </button>
          <span id="charCount">0 / 5000</span>
        </div>
      </div>

      <!-- Output Box -->
      <div class="flex flex-col border border-slate-300 rounded-xl p-4 bg-slate-50">
        <div class="flex justify-between items-center pb-2 mb-2 border-b border-slate-200">
          <select id="toLang" class="bg-transparent text-slate-700 font-semibold focus:outline-none cursor-pointer">
            <!-- Populated via JS -->
          </select>
        </div>
        <textarea id="outputText" rows="6" readonly placeholder="Translation will appear here..." 
          class="w-full bg-transparent resize-none focus:outline-none text-slate-800 placeholder-slate-400"></textarea>
        <div class="flex justify-end items-center gap-3 pt-2 text-slate-400 text-sm">
          <button id="outputSpeakBtn" title="Listen Translation" class="hover:text-indigo-600 transition">
            <i class="fa-solid fa-volume-high"></i>
          </button>
          <button id="copyBtn" title="Copy Text" class="hover:text-indigo-600 transition">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
      </div>

    </div>

    <!-- Actions Area -->
    <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <!-- Swap Languages Button -->
      <button id="swapBtn" class="flex items-center gap-2 text-slate-600 hover:text-indigo-600 font-medium px-4 py-2 rounded-lg border border-slate-300 hover:border-indigo-600 transition w-full sm:w-auto justify-center">
        <i class="fa-solid fa-arrows-rotate"></i> Swap Languages
      </button>

      <!-- Translate Button -->
      <button id="translateBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-8 py-3 rounded-lg shadow-md transition duration-200 w-full sm:w-auto flex items-center justify-center gap-2">
        <span>Translate</span>
        <i class="fa-solid fa-paper-plane"></i>
      </button>
    </div>

    <!-- Toast Notification for Copying -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-2 rounded-lg text-sm shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none">
      Copied to clipboard!
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
